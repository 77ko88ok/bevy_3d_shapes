[package]
name = "bevy_3d_shapes"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = {version = "0.20", default-features = false, features = ["3d", "bevy_winit", "bevy_render", "bevy_pbr", "bevy_text", "bevy_ui", "dynamic_linking"]}

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3